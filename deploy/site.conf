# The bare site on :3000, where the tunnel sends everything but /mcp.
server {
    listen 3000;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(testnet/)?v1/ {
        rewrite ^/testnet(/v1/.*)$ $1 break;
        set $up http://api:8787;
        proxy_pass $up;
    }
    # Answers 502 until the mainnet services run.
    location /mainnet/v1/ {
        rewrite ^/mainnet(/v1/.*)$ $1 break;
        set $up http://api-mainnet:8787;
        proxy_pass $up;
    }
    location ~ \.md$ { default_type text/plain; }
    location / { try_files $uri $uri/ /index.html; }
}
