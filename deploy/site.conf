# The bare site on :3000, where the tunnel sends everything but /mcp.
server {
    listen 3000;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(testnet/)?v1/ {
        rewrite ^/testnet(/v1/.*)$ $1 break;
        set $up http://api:8787;
        proxy_pass $up;
    }
    # Answers 502 until the mainnet services run.
    location /mainnet/v1/ {
        rewrite ^/mainnet(/v1/.*)$ $1 break;
        set $up http://api-mainnet:8787;
        proxy_pass $up;
    }
    # Grader builds by hash; OutLayer checks the hash of what it downloads.
    location ~ ^/grader/[0-9a-f]{64}\.wasm$ {
        root /;
        default_type application/wasm;
    }
    # Connector sign-up (sphinx-mcp --connect): POST start, then finish.
    location ~ ^/connect/api/testnet/(start|finish)$ {
        set $up http://mcp-connect:8790;
        rewrite ^/connect/api/testnet/(.*)$ /connect/$1 break;
        proxy_pass $up;
    }
    location ~ ^/connect/api/mainnet/(start|finish)$ {
        set $up http://mcp-connect-mainnet:8790;
        rewrite ^/connect/api/mainnet/(.*)$ /connect/$1 break;
        proxy_pass $up;
    }
    location ~ \.md$ { default_type text/plain; }
    location / { try_files $uri $uri/ /index.html; }
}
