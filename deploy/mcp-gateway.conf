# Routes MCP traffic from the tunnel. Streamable HTTP needs unbuffered,
# long-lived responses.
server {
    listen 8790;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    client_max_body_size 1m;

    # Look names up through Docker's DNS on every request: containers get new
    # addresses when they are recreated, and a cached address could send one
    # connector's traffic to another container. Every route names its
    # upstream through a variable, which makes nginx use this resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # One file per private connector:
    #   location /mcp/<token> { set $up http://mcp-<name>:8790; proxy_pass $up; }
    include /etc/nginx/mcp-routes/*.conf;

    # The public read-only servers: /mcp/testnet (and /mcp, kept for
    # connectors added before) and /mcp/mainnet (a route file written by
    # deploy.sh once mainnet runs).
    location = /mcp/testnet {
        set $up http://mcp-public:8790;
        rewrite ^ /mcp break;
        proxy_pass $up;
    }

    # Self-serve connectors: /mcp/testnet/<token> (mainnet's are added by
    # deploy.sh). The exact /mcp/testnet above stays the public server.
    location ^~ /mcp/testnet/ {
        set $up http://mcp-connect:8790;
        proxy_pass $up;
    }

    # A private address that matches no connector is refused, not quietly
    # served read-only.
    location /mcp/ {
        return 404;
    }

    location / {
        set $up http://mcp-public:8790;
        proxy_pass $up;
    }
}
