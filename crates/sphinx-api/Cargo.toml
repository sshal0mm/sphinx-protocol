[package]
name = "sphinx-api"
description = "Sphinx job API: plain HTTP + JSON access to jobs, submissions, code storage and gasless relaying."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "sphinx-api"
path = "src/main.rs"

[dependencies]
sphinx-protocol = { path = "../sphinx-protocol" }
sphinx-near = { path = "../sphinx-near" }
axum = "0.8"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "signal"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek.workspace = true
borsh = "1.5"

[lints]
workspace = true
