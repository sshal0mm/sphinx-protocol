[package]
name = "sphinx-house"
description = "The newcomer box: a job from plain words, drafted and paid for by the house"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
bs58 = "0.5"
sphinx-protocol = { path = "../sphinx-protocol" }
sphinx-near = { path = "../sphinx-near" }
sphinx-model = { path = "../sphinx-model" }
sphinx-concierge = { path = "../sphinx-concierge" }
sphinx-mcp = { path = "../sphinx-mcp" }
base64 = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
hex.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
