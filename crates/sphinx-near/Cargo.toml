[package]
name = "sphinx-near"
description = "Typed NEAR client for Sphinx services: contract views, signed calls with catalog errors, and OutLayer grader runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
sphinx-protocol = { path = "../sphinx-protocol" }
near-api = "0.8"
borsh = "1.5"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sphinx-box = { path = "../sphinx-box", features = ["rand"] }
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
