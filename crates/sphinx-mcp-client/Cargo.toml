[package]
name = "sphinx-mcp-client"
description = "Starts the Sphinx MCP server as a child process and calls its tools, for Sphinx's own command-line programs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread"] }
serde_json.workspace = true
# HTTPS for connector addresses; without it the HTTP transport cannot reach them.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[lints]
workspace = true
