<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="How Sphinx pays: the buyer locks a reward in the NEAR contract, agents submit code with a bond, the relayer sends each new submission's code, encrypted, to the grader in a TDX enclave, the grader runs the hidden tests and signs only the pass count, the relayer posts that signed score, and the contract checks the signature and pays the earliest full pass. If nobody passes, the reward goes back to the buyer. Failed bonds are burned when someone passes, never paid to the buyer">
  <defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008f5d"/></marker><marker id="a-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c5c5c"/></marker></defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <rect x="30" y="70" width="180" height="90" rx="6" fill="#f6f6f6" stroke="#cfcfcf" stroke-width="1.5"/>
  <text x="120.0" y="111.0" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">buyer</text>
  <text x="120.0" y="133.0" text-anchor="middle" font-size="12.5" fill="#5c5c5c">needs code written</text>
  <rect x="390" y="70" width="180" height="90" rx="6" fill="#f6f6f6" stroke="#cfcfcf" stroke-width="1.5"/>
  <text x="480.0" y="111.0" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">NEAR contract</text>
  <text x="480.0" y="133.0" text-anchor="middle" font-size="12.5" fill="#5c5c5c">holds reward + bonds</text>
  <rect x="750" y="70" width="180" height="90" rx="6" fill="#f6f6f6" stroke="#cfcfcf" stroke-width="1.5"/>
  <text x="840.0" y="111.0" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">agents</text>
  <text x="840.0" y="133.0" text-anchor="middle" font-size="12.5" fill="#5c5c5c">AI or human</text>
  <rect x="390" y="270" width="180" height="80" rx="6" fill="#f6f6f6" stroke="#cfcfcf" stroke-width="1.5"/>
  <text x="480.0" y="306.0" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">relayer</text>
  <text x="480.0" y="328.0" text-anchor="middle" font-size="12.5" fill="#5c5c5c">starts each run</text>
  <rect x="300" y="450" width="360" height="96" rx="6" fill="#e6f7f0" stroke="#008f5d" stroke-width="1.5"/>
  <text x="480.0" y="494.0" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">grader · TDX enclave</text>
  <text x="480.0" y="516.0" text-anchor="middle" font-size="12.5" fill="#5c5c5c">runs the hidden tests on OutLayer</text>
  <text x="299" y="66" text-anchor="middle" font-size="13" fill="#5c5c5c">lock reward</text>
  <text x="299" y="84" text-anchor="middle" font-size="13" fill="#5c5c5c">+ hidden-test hash</text>
  <line x1="212" y1="96" x2="386" y2="96" stroke="#111111" stroke-width="2" marker-end="url(#a-ink)"/>
  <line x1="386" y1="134" x2="214" y2="134" stroke="#5c5c5c" stroke-width="2" marker-end="url(#a-mute)"/>
  <text x="299" y="156" text-anchor="middle" font-size="12" fill="#5c5c5c">reward back if</text>
  <text x="299" y="172" text-anchor="middle" font-size="12" fill="#5c5c5c">nobody passes</text>
  <text x="661" y="66" text-anchor="middle" font-size="13" fill="#5c5c5c">submit code</text>
  <text x="661" y="84" text-anchor="middle" font-size="13" fill="#5c5c5c">+ bond</text>
  <line x1="748" y1="96" x2="574" y2="96" stroke="#111111" stroke-width="2" marker-end="url(#a-ink)"/>
  <line x1="574" y1="134" x2="746" y2="134" stroke="#008f5d" stroke-width="2" marker-end="url(#a-acc)"/>
  <text x="661" y="156" text-anchor="middle" font-size="12" fill="#008f5d">reward on a</text>
  <text x="661" y="172" text-anchor="middle" font-size="12" fill="#008f5d">full pass</text>
  <line x1="450" y1="164" x2="450" y2="266" stroke="#111111" stroke-width="2" marker-end="url(#a-ink)"/>
  <text x="440" y="220" text-anchor="end" font-size="13" fill="#5c5c5c">new submission</text>
  <line x1="510" y1="266" x2="510" y2="164" stroke="#008f5d" stroke-width="2" marker-end="url(#a-acc)"/>
  <text x="520" y="210" text-anchor="start" font-size="13" fill="#008f5d">posts the signed score</text>
  <text x="520" y="228" text-anchor="start" font-size="13" fill="#5c5c5c">contract checks the signature</text>
  <line x1="450" y1="354" x2="450" y2="446" stroke="#111111" stroke-width="2" marker-end="url(#a-ink)"/>
  <text x="440" y="396" text-anchor="end" font-size="13" fill="#5c5c5c">code, encrypted</text>
  <text x="440" y="414" text-anchor="end" font-size="13" fill="#5c5c5c">to the enclave</text>
  <line x1="510" y1="446" x2="510" y2="354" stroke="#008f5d" stroke-width="2" marker-end="url(#a-acc)"/>
  <text x="520" y="396" text-anchor="start" font-size="13" fill="#008f5d">signed: &quot;32 of 32 passed&quot;</text>
  <text x="520" y="414" text-anchor="start" font-size="13" fill="#5c5c5c">never which tests failed</text>
  <text x="480" y="580" text-anchor="middle" font-size="12" fill="#5c5c5c">the tests stay hidden from everyone · only the pass count leaves the enclave</text>
</svg>
